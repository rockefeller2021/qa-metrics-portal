<div class="flex items-center gap-2 p-1.5 bg-white/5 border border-white/10 rounded-2xl backdrop-blur-md">
  <button
    (click)="themeService.setTheme('dark')"
    [class.bg-indigo-500\/30]="themeService.isDark()"
    [class.text-indigo-400]="themeService.isDark()"
    [class.text-slate-400]="!themeService.isDark()"
    class="flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold transition-all hover:text-white"
    title="Activar Modo Oscuro">
    🌙 Oscuro
  </button>
  <button
    (click)="themeService.setTheme('light')"
    [class.bg-amber-500\/30]="!themeService.isDark()"
    [class.text-amber-500]="!themeService.isDark()"
    [class.text-slate-400]="themeService.isDark()"
    class="flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold transition-all hover:text-amber-600"
    title="Activar Modo Claro">
    ☀️ Claro
  </button>
</div>
